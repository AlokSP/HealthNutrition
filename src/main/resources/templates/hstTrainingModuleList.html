<!DOCTYPE html>
<html xmlns:th="https://thymeleaf.org">
<head th:replace="common/trail :: common-trail (pageTitle='HST Training Modules')">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">	
</head>
<body>
 <script src="https://cdn.plyr.io/3.6.2/plyr.js"></script>
 
  <section th:replace="index.html :: header-bar"></section>
<nav class="navbar navbar-expand-lg navbar-light bg-light" th:fragment="navbar">
   
        <span style="margin-top:8px; padding-top:8px;"><a th:href="@{/}"> <img th:src="@{/image/logo.png}" href="www.google." alt="Spoken Tutorial" height="50" width="50"> </img></a>
								<span style="color: rgba(0,0,0,0.9);font-size: 1.6rem; margin-top:8px;" class="ml-3">HST Training Modules  </span> </span>

        
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNavBar" aria-controls="mainNavBar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavBar">
            <div class="navbar-nav ml-auto">
                <a class="nav-item nav-link active" th:href="@{/}">Home <span class="sr-only">(current)</span></a>
                <div th:replace="common/commonItemsHSTTrainingModule :: download_package"></div>
            </div>
        </div>
  
</nav>
<div class="container">

    <div th:replace="common/commonItemsHSTTrainingModule :: new_search_bar"></div>

    <main>

        <div class="row">

            <div class="col-lg-6 mb-4"
                 th:each="temp : ${weekTitleVideoView}">

                <a th:href="@{'/hstTrainingModuleView/' + ${temp.getWeekTitleVideoId()} + '/'}"
                   class="text-decoration-none text-dark">

                    <div class="card tutorial-card">

                        <div class="row g-0 h-100 align-items-center">

                            <!-- Thumbnail -->
                            <div class="col-6">

                                <div class="thumbnail-wrapper">

							        <img th:src="@{/files/}+@{${temp.getVideoResource().getThumbnailPath()}}"
							             class="tutorial-thumbnail"
							             alt="Thumbnail">
							
							        <div class="play-button">
							            <i class="fa fa-play"></i>
							        </div>
							
							    </div>

                            </div>

                            <!-- Details -->
                            <div class="col-6">

                                <div class="card-body tutorial-body">

                                    <div class="week-name">

                                        <span th:text="${temp.getWeek().getWeekName()}"></span>

                                        <span th:if="${temp.getVideoResource().getSessionName()!=null}">
                                            :
                                            <span th:text="${temp.getVideoResource().getSessionName()}"></span>
                                        </span>

                                    </div>

                                    <div class="tutorial-title"
                                         th:text="${temp.getTitle()}">
                                    </div>

                                    <div class="language mt-auto">

                                        <strong>Language :</strong>

                                        <i><span th:text="${temp.getVideoResource().getLan().getLangName()}"></span></i>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </a>

            </div>

        </div>

    <div th:unless="${weekTitleVideoView.size()>0}" ><h4>No Content found for  query:</h4>
	<br><h5 th:if="${weekforQuery!=null}"><b>Week:</b> <span th:text="${weekforQuery.getWeekName()}"></span></h5>
	
	<h5 th:if="${lanforQuery!=null}"><b>Language:</b> <span th:text="${lanforQuery.getLangName()}"></span></h5>
	<br><br></div>
	
	
	
</main>

</div>




	<nav th:if="${weekTitleVideoView.size()>0}"  aria-label="Page navigation example" class="navbar fixed-bottom navbar-brand" style="left: auto; right: 5px">
		  <ul class="pagination pagination-sm ">
		  
		  
		    <li th:if ="${currentPage != 0}" class="page-item" aria-label="First"><a class="page-link"   th:href="@{'/Training-Modules?week='+${week}+'&lang='+${language} +'&page='+${0}}"> &laquo</a></li>
		    <li th:if ="${currentPage != 0}" class="page-item" aria-label="Previous"><a class="page-link"   th:href="@{'/Training-Modules?week='+${week}+'&lang='+${language}+'&page='+${currentPage -1}}"> &lt</a></li>
		    <li th:classappend = "${currentPage==i-1?'active':''}" th:each="i : ${#numbers.sequence(firstPage,lastPage)}" class="page-item"><a class="page-link" th:href="@{'/Training-Modules?week='+${week}+'&lang='+${language}+'&page='+${i-1}}"><span th:text="${i}"/></a></li>
		    <li th:if ="${currentPage+1 != totalPages}" class="page-item" aria-label="Next"><a class="page-link" th:href="@{'/Training-Modules?week='+${week}+'&lang='+${language}+ '&page='+${currentPage +1 }}">&gt</a></li>
		    <li th:if ="${currentPage+1 != totalPages}" class="page-item" aria-label="Last"><a class="page-link"   th:href="@{'/Training-Modules?week='+${week}+'&lang='+${language}+'&page='+${totalPages-1}}"> &raquo</a></li>
		  </ul>
		</nav>
		
	
		
<div th:replace="common/trail :: body-bottom-scripts"></div>

<style>
	


.tutorial-card{

    border:none;
    border-radius:12px;

    overflow:hidden;

    height:185px;

    background:#fff;

    transition:all .25s ease;

    box-shadow:0 2px 10px rgba(0,0,0,.08);

}

.tutorial-card:hover{

    transform:translateY(-4px);

    box-shadow:0 8px 24px rgba(0,0,0,.18);

}



.thumbnail-wrapper{
    position:relative;
    width:100%;
    height:190px;
    overflow:hidden;
    cursor:pointer;
}

.tutorial-thumbnail{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .35s ease;
}

.tutorial-card:hover .tutorial-thumbnail{
    transform:scale(1.05);
}



.thumbnail-wrapper::after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.18);
    z-index:1;
    transition:.3s;
}

.tutorial-card:hover .thumbnail-wrapper::after{
    background:rgba(0,0,0,.08);
}



.play-button{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:50px;
    height:50px;
    border-radius:50%;
    background:#ff9033;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:5;
    box-shadow:0 5px 15px rgba(0,0,0,.35);
    transition:.3s;
}

.play-button i{
    color:#fff;
    font-size:24px;
    margin-left:4px;
}

.tutorial-card:hover .play-button{
    transform:translate(-50%,-50%) scale(1.1);
    background:#ff7a00;
}


.tutorial-body{

    height:185px;

    padding:12px 14px;

    display:flex;

    flex-direction:column;

}



.week-name{

    color:#0d6efd;

    font-weight:700;

    font-size:15px;

    margin-bottom:8px;

    line-height:1.3;

}



.tutorial-title{

    font-size:17px;

    font-weight:600;

    color:#222;

    line-height:1.45;

    display:-webkit-box;

    -webkit-box-orient:vertical;

    -webkit-line-clamp:4;

    overflow:hidden;

    min-height:50px;

    margin-bottom:12px;

}



.language{

    margin-top:auto;
     font-weight:500;

    font-size:15px;

    color:black;

}



@media (max-width:991px){

    .tutorial-card{

        height:auto;

    }

    .tutorial-thumbnail{

        height:210px;

    }

    .tutorial-body{

        height:auto;

    }

}

@media (max-width:576px){

    .tutorial-card{

        border-radius:10px;

    }

    .tutorial-thumbnail{

        height:180px;

    }

    .tutorial-title{

        min-height:auto;

    }

}
	
  :root {
  --plyr-color-main: #ff9033;
   
}
  .plyr__controls__item plyr__volume{
    margin-bottom: 25px;
    padding-bottom:25px;
  }
  
</style>


<script>
		var projectPath='[(@{/})]';
		
		
  		
		 
var isPlaying = [];
		
		var videos = document.querySelectorAll('video');
		
		document.addEventListener('DOMContentLoaded', function() {
		      // Get the first video element
		      const firstVideo = document.querySelector('video');

		      // Mute the first video
		      firstVideo.muted = true;
		      firstVideo.play();
		    });
		
		for(var i=0; i<videos.length; i++){
			if(i==0){
				//videos[i].muted=true;
				//videos[i].play();
				//videos[i].muted=true;
				
			}
			
		  	videos[i].addEventListener('play', function(){pauseAll(this)}, true);
		    videos[i].addEventListener('mouseover', playMutedVideoMouseOver);
		    videos[i].addEventListener('click', playUnmutedVideoOnClick);
		    videos[i].addEventListener('mouseout', pauseWithMutedVideoMouseOut);
		    
		    
		    isPlaying.push(false);
		    
		    videos[i].addEventListener("touchstart", function() {
		      var index = Array.from(videos).indexOf(this);
		      var flagCheck=0;
			 	for (var j = 0; j < videos.length; j++){
					 if(!videos[j].paused && !videos[j].muted)
						 flagCheck=flagCheck+1;
				 }
			 	
			 	if(flagCheck==0){
			 		if (!isPlaying[index]) {
			 			videos[index].muted=true;
				        videos[index].play();
				        videos[index].muted=true;
				        isPlaying[index] = true;
				      }
			 		}
		   		 });

		     videos[i].addEventListener("touchend", function() {
		      	var index = Array.from(videos).indexOf(this);
		      	if (isPlaying[index]) {
		        	videos[index].pause();
		        	isPlaying[index] = false;
		     		 }
		   		 });
		   
			}
		
		

		function pauseAll(elem){
		        
			for(var i=0; i<videos.length; i++){
		                if(videos[i] == elem) continue;
		                if(videos[i].played.length > 0 && !videos[i].paused){
		                  videos[i].pause();
		                }
		        }
		  }
		
		
		
		
		   // Functions to play the video with/without sound
			function playMutedVideoMouseOver(event) {
				var video = event.target;
			 	var flag=0;
			 	for (var j = 0; j < videos.length; j++){
					 if(!videos[j].paused && !videos[j].muted)
			 			flag=flag+1;
				 }
			 	if(flag==0){
			 	video.play();
			 	video.muted = true;
				}
			 
			}
		   

			function playUnmutedVideoOnClick(event) {
			 var video = event.target;
			 video.muted = true;
			 video.play();
			}
			
			function pauseWithMutedVideoMouseOut(event) {
				 var video = event.target;
					if(video.muted){
						video.pause();
						//video.muted=!video.muted;
					}
				 
				}
				
			
		
			 
			
			
		
			
		
		 var controls =
			 [
			     //'play-large', // The large play button in the center
			    // 'restart', // Restart playback
			    // 'rewind', // Rewind by the seek time (default 10 seconds)
			    // 'play', // Play/pause playback
			    
			    // 'progress', // The progress bar and scrubber for playback and buffering
			    // 'current-time', // The current time of playback
			    
			     //'mute', // Toggle mute
			    //'volume', // Volume control
			    
			     //'settings', // Settings menu
			    // 'pip', // Picture-in-picture (currently Safari only)
			    // 'airplay', // Airplay (currently Safari only)
			    // 'download', // Show a download button with a link to either the current source or a custom URL you specify in your options
			    // 'fullscreen' // Toggle fullscreen
			 ];

		for(var i=0; i<videos.length; i++){
		
			const player = new Plyr(videos[i],{controls});	
			
			
			   
		}
</script>
</body>
</html>
